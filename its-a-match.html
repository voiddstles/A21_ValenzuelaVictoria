<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATCH - It's a match!</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container"> 
        <div class="dotted-container">
            
            <div class="match-container"> 
                <h1>It's a match!</h1>
                <header>
                    <img src="https://via.placeholder.com/200" alt="Match photo"/>
                    <div class="match-name">
                        <p id="first-name">John Doe</p>
                        <p id="age">20</p>
                    </div>
                </header>
        
                <div class="match-info">
                    <p id="gender"><strong>Genero</strong>Male</p>
                    <p id="dob"><strong>Fecha de Nacimiento</strong>2004-04-15</p>
                </div>
        
                <div class="location">
                    <p id="address"><strong>Direccion</strong>Calle Wallaby 42</p>
                    <p id="city"><strong>Ciudad</strong>Sidney</p>
                    <p id="state"><strong>Estado</strong>-</p>
                    <p id="country"><strong>Pais</strong>Australia</p>
                </div>
        
                <div class="contact">
                    <p id="email"><strong>Correo</strong>hola@hotmail.com</p>
                    <p id="phone"><strong>Telefono</strong>55 5555 5555</p>
                    <p id="cellphone"><strong>Celular</strong>33 3333 3333</p>
                </div>
            </div>
            </div>
    </div>
</body>
</html>
